name: latest

# Moves the branch `latest` to each published release. The template's AINVFX_REPO_RAW names
# https://raw.githubusercontent.com/AInVFX/ainvfx-runpod/latest, so new pods run the newest release with no edit to the
# template. A tag whose version differs from pod.py's or bootstrap.sh's, or that fails the fast tests, stops here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to point latest at (vX.Y.Z, 1.3.2 or later)"
        required: true

permissions:
  contents: write

jobs:
  latest:
    name: Point latest at the release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git checkout "refs/tags/$TAG"
      - name: The tag, pod.py and bootstrap.sh name the same version
        run: |
          V="${TAG#v}"
          grep -q "^VERSION = \"$V\"" pod.py || { echo "pod.py does not say VERSION = \"$V\""; exit 1; }
          grep -q "^TOOLKIT_VERSION=\"$V\"" bootstrap.sh || { echo "bootstrap.sh does not say TOOLKIT_VERSION=\"$V\""; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The fast tests
        run: |
          python -m unittest discover -s tests -p "test_repo.py"
          cd tests && python -m unittest test_pod.Helpers
      - name: Move latest
        run: git push --force origin "$(git rev-parse "refs/tags/$TAG^{commit}"):refs/heads/latest"
